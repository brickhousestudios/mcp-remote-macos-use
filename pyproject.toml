[project]
name = "mcp_remote_macos_use"
version = "0.1.0"
description = "A MCP server for remote MacOS control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.4.1",
    "python-dotenv==1.0.1",
    "pillow==11.0.0",  # Pin to latest secure version
    "pyDes==2.0.1",  # Note: Deprecated library, required for VNC Protocol 30
    "cryptography==44.0.0",
    "anthropic==0.49.0",
    "paramiko==3.5.1",
    "livekit==1.0.5",
    "aiohttp==3.11.11",  # Pin to latest secure version
    "websockets==14.1",  # Pin to latest secure version
    "aiortc==1.10.0",  # Pin to latest stable version
    "livekit-api==1.0.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.389",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "bandit>=1.7.10",  # Security linter
    "safety>=3.2.0"     # Dependency vulnerability scanner
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_remote_macos_use"]

[project.scripts]
mcp_remote_macos_use = "mcp_remote_macos_use:main" 